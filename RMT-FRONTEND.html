




<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rate My Teacher</title>

    <style>

        /* =========================
           BASIC PAGE
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #222;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #4f46e5;
        }

        nav a {
            text-decoration: none;
            color: #444;
            margin-left: 30px;
            font-size: 15px;
        }

        nav a:hover {
            color: #4f46e5;
        }


        /* =========================
           HERO / SEARCH
           ========================= */

        .hero {
            text-align: center;
            padding: 55px 20px 45px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #666;
            font-size: 17px;
            margin-bottom: 28px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-box {
            width: 480px;
            padding: 15px 18px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: #4f46e5;
        }

        .search-button {
            margin-left: 10px;
            padding: 15px 24px;

            border: none;
            border-radius: 10px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .search-button:hover {
            background: #3730a3;
        }


        /* =========================
           TEACHER SECTION
           ========================= */

        .teachers {
            max-width: 1150px;
            margin: 0 auto;

            padding: 20px 30px 70px;
        }

        .teachers h2 {
            font-size: 27px;
            margin-bottom: 25px;
        }


        /* =========================
           TEACHER GRID
           ========================= */

        .teacher-grid {
            display: grid;

            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 22px;
        }


        /* =========================
           TEACHER CARD
           ========================= */

        .teacher-card {
            background: white;

            border: 1px solid #ddd;
            border-radius: 14px;

            padding: 24px;

            min-height: 245px;

            display: flex;
            flex-direction: column;

            transition: 0.2s ease;
        }

        .teacher-card:hover {
            transform: translateY(-4px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }


        /* TEACHER NAME */

        .teacher-card h3 {
            font-size: 21px;
            margin-bottom: 8px;
        }


        /* TEAM + GRADE */

        .team-grade {
            color: #777;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 12px;

            text-transform: uppercase;
        }


        /* SUBJECT */

        .subject {
            color: #555;

            font-size: 15px;

            line-height: 1.4;

            margin-bottom: 20px;
        }


        /* RATING */

        .rating {
            font-size: 14px;

            margin-top: auto;
            margin-bottom: 18px;
        }

        .stars {
            display: block;

            font-size: 19px;

            margin-bottom: 5px;

            letter-spacing: 2px;
        }

        .rating-text {
            color: #777;
        }


        /* VIEW REVIEWS */

        .view-button {
            display: block;

            text-align: center;

            padding: 11px;

            background: #eef2ff;
            color: #4f46e5;

            text-decoration: none;

            border-radius: 8px;

            font-size: 14px;
            font-weight: bold;
        }

        .view-button:hover {
            background: #e0e7ff;
        }


        /* =========================
           NO RESULTS
           ========================= */

        #no-results {
            display: none;

            text-align: center;

            color: #777;

            margin-top: 30px;
        }


        /* =========================
           FOOTER
           ========================= */

        footer {
            background: white;

            border-top: 1px solid #ddd;

            text-align: center;

            padding: 25px;

            color: #777;
        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 900px) {

            .teacher-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        }


        /* =========================
           PHONE
           ========================= */

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            nav a {
                margin-left: 12px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .search-container {
                flex-direction: column;
            }

            .search-box {
                width: 90%;
            }

            .search-button {
                width: 90%;
                margin-left: 0;
                margin-top: 10px;
            }

            .teachers {
                padding: 20px;
            }

            .teacher-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">
            Rate<span>MyTeacher</span>
        </div>

        <div>
            <a href="#">Home</a>
            <a href="#">Teachers</a>
            <a href="#">About</a>
        </div>

    </nav>



    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <h1>Find Your Teachers</h1>

        <p>
            See what students think about their teachers.
        </p>

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search for a teacher..."
            >

            <button
                id="searchButton"
                class="search-button"
            >
                Search
            </button>

        </div>

    </section>



    <!-- =========================
         TEACHERS
    ========================= -->

    <section class="teachers">

        <h2>Teachers in Rio</h2>

        <div
            class="teacher-grid"
            id="teacherGrid"
        >

        </div>


        <p id="no-results">
            No teachers found.
        </p>

    </section>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 RateMyTeacher
        </p>

    </footer>

    <!-- =========================
         SEARCH JAVASCRIPT
    ========================= -->

    <script>

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const teacherCards =
            document.querySelectorAll(".teacher-card");

        const noResults =
            document.getElementById("no-results");


        function searchTeachers() {

            const searchText =
                searchInput.value
                .toLowerCase()
                .trim();

            let foundTeacher = false;


            teacherCards.forEach(function(card) {

                const name =
                    card.querySelector("h3")
                    .textContent
                    .toLowerCase();

                const subject =
                    card.querySelector(".subject")
                    .textContent
                    .toLowerCase();

                const team =
                    card.querySelector(".team-grade")
                    .textContent
                    .toLowerCase();


                if (
                    name.includes(searchText) ||
                    subject.includes(searchText) ||
                    team.includes(searchText)
                ) {

                    card.style.display = "flex";

                    foundTeacher = true;

                } else {

                    card.style.display = "none";

                }

            });


            if (foundTeacher) {

                noResults.style.display = "none";

            } else {

                noResults.style.display = "block";

            }

        }


        searchButton.addEventListener(
            "click",
            searchTeachers
        );


        searchInput.addEventListener(
            "input",
            searchTeachers
        );


        searchInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    searchTeachers();
                }

            }
        );

    </script>


</body>

</html>
